syntax = "proto3";
package twilight.coreslot.v1;

import "twilight/coreslot/v1/coreslot.proto";

option go_package = "github.com/twilight-project/twilight-core/x/coreslot/types";

message GenesisState {
  Params params = 1;
  repeated CoreSlot slots = 2;
  repeated PendingKeyRotation pending_key_rotations = 3;
  repeated ReservedConsensusAddress reserved_consensus_addresses = 4;
  repeated OperatorRewardWeight reward_weights = 5;
  repeated LastAppliedValidator last_applied_validators = 6;
  uint64 next_slot_id = 7;
  // selection_policies carries the Selection policy history a fresh V2 genesis
  // must supply: exactly one version-1 row per slot. Per-slot rate and maximum
  // are operator configuration and are not derivable, so they cannot be
  // synthesized by InitGenesis.
  repeated SelectionPolicyVersion selection_policies = 8;
}
