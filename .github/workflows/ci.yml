name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2.x is required for Go 1.25 (the v1 line stops at Go 1.24).
          # .golangci.yml is in v2 config format. Bump this pin intentionally.
          version: v2.12.2
          # Only flag issues introduced by the PR — keeps the large existing
          # codebase from blocking CI while enforcing quality on new code.
          only-new-issues: true

  formatting:
    name: gofmt & tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './website/*'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  proto-descriptor:
    name: proto descriptor up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protoc (pinned)
        # Must match EXPECTED_PROTOC_VERSION in scripts/export-proto-descriptor.sh —
        # the descriptor set is byte-reproducible only for a fixed protoc version.
        run: |
          PROTOC_VERSION=27.0
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
      - name: Populate module cache (proto include paths)
        # Explicitly fetch the modules whose proto/ trees the export script includes.
        # Some are indirect / proto-only deps (e.g. gogo/googleapis) that a bare
        # `go mod download` can prune, leaving the script's include paths missing.
        run: |
          go mod download
          go mod download \
            github.com/cosmos/cosmos-sdk \
            github.com/cosmos/gogoproto \
            cosmossdk.io/api \
            github.com/cosmos/cosmos-proto \
            github.com/gogo/googleapis
      - name: Regenerate descriptor
        run: make proto-descriptor
      - name: Verify committed descriptor is up to date
        run: |
          changed=$(git status --porcelain -- docs/proto/)
          if [ -n "$changed" ]; then
            echo "::error::docs/proto/ is stale. Run 'make proto-descriptor' (protoc 27.0) and commit the result."
            echo "$changed"
            git diff -- docs/proto/ || true
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Blocking. The dependency + Go-toolchain upgrade (go 1.25.11, grpc v1.79.3,
    # x/net v0.53.0) cleared every reachable advisory -- govulncheck reports 0
    # vulnerabilities affecting called symbols. The step is intentionally blocking
    # so a newly reachable advisory fails CI and is triaged, rather than silently
    # accumulating. (govulncheck exits non-zero only on reachable findings;
    # advisories in required modules that the code does not call do not fail it.)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: |
          # Pinned (bump intentionally, like protoc/golangci-lint) so a new
          # govulncheck release cannot change gating behavior without a code change.
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          "$(go env GOPATH)/bin/govulncheck" ./...
