syntax = "proto3";
package twilight.coreslot.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "google/protobuf/any.proto";
import "cosmos_proto/cosmos.proto";
import "twilight/coreslot/v1/coreslot.proto";

option go_package = "github.com/twilight-project/twilight-core/x/coreslot/types";

service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc RegisterCoreSlot(MsgRegisterCoreSlot) returns (MsgRegisterCoreSlotResponse);
  rpc ActivateCoreSlot(MsgActivateCoreSlot) returns (MsgActivateCoreSlotResponse);
  rpc InactivateCoreSlot(MsgInactivateCoreSlot) returns (MsgInactivateCoreSlotResponse);
  rpc SuspendCoreSlot(MsgSuspendCoreSlot) returns (MsgSuspendCoreSlotResponse);
  rpc RemoveCoreSlot(MsgRemoveCoreSlot) returns (MsgRemoveCoreSlotResponse);
  rpc RotateConsensusKey(MsgRotateConsensusKey) returns (MsgRotateConsensusKeyResponse);
  rpc UpdatePayoutAddress(MsgUpdatePayoutAddress) returns (MsgUpdatePayoutAddressResponse);
  rpc UpdateOperatorMetadata(MsgUpdateOperatorMetadata) returns (MsgUpdateOperatorMetadataResponse);
  rpc UpdateSettlementAddress(MsgUpdateSettlementAddress) returns (MsgUpdateSettlementAddressResponse);
  rpc UpdateSelectionPolicy(MsgUpdateSelectionPolicy) returns (MsgUpdateSelectionPolicyResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// InitialSelectionPolicy is the caller-supplied part of a slot's first Selection
// policy. It carries only the two operator-selectable values: the keeper assigns
// slot_id, policy_version and the validity window from consensus state, so a
// registration transaction cannot choose its own version numbering or window.
message InitialSelectionPolicy {
  uint64 selection_rate_bps = 1;
  uint64 max_selected_participants = 2;
}

message MsgRegisterCoreSlot {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "twilight/coreslot/MsgRegisterCoreSlot";
  string authority = 1;
  string operator_address = 2;
  google.protobuf.Any consensus_pubkey = 3 [(cosmos_proto.accepts_interface) = "cosmos.crypto.PubKey"];
  string payout_address = 4;
  OperatorMetadata metadata = 5;
  string settlement_address = 6;
  InitialSelectionPolicy initial_selection_policy = 7;
}
message MsgRegisterCoreSlotResponse { uint64 slot_id = 1; }

message MsgActivateCoreSlot {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 slot_id = 2;
}
message MsgActivateCoreSlotResponse {}

message MsgInactivateCoreSlot {
  option (cosmos.msg.v1.signer) = "authority_or_operator";
  string authority_or_operator = 1;
  uint64 slot_id = 2;
  string reason = 3;
}
message MsgInactivateCoreSlotResponse {}

message MsgSuspendCoreSlot {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 slot_id = 2;
  string reason = 3;
  string evidence_reference = 4;
}
message MsgSuspendCoreSlotResponse {}

message MsgRemoveCoreSlot {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 slot_id = 2;
  string reason = 3;
}
message MsgRemoveCoreSlotResponse {}

message MsgRotateConsensusKey {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 slot_id = 2;
  google.protobuf.Any new_consensus_pubkey = 3 [(cosmos_proto.accepts_interface) = "cosmos.crypto.PubKey"];
}
message MsgRotateConsensusKeyResponse {}

message MsgUpdatePayoutAddress {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1;
  uint64 slot_id = 2;
  string new_payout_address = 3;
}
message MsgUpdatePayoutAddressResponse {}

message MsgUpdateOperatorMetadata {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1;
  uint64 slot_id = 2;
  OperatorMetadata metadata = 3;
}
message MsgUpdateOperatorMetadataResponse {}

// MsgUpdateSettlementAddress replaces a slot's operational credential address
// (section 24). Permitted in PENDING/ACTIVE/INACTIVE, rejected while SUSPENDED
// and after REMOVED; an identical no-op replacement is rejected.
message MsgUpdateSettlementAddress {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1;
  uint64 slot_id = 2;
  string settlement_address = 3;
}
message MsgUpdateSettlementAddressResponse {}

// MsgUpdateSelectionPolicy replaces a slot's Selection policy with a new
// immutable version (section 26). Permitted in PENDING/ACTIVE/INACTIVE, rejected
// while SUSPENDED and after REMOVED; an identical no-op replacement is rejected.
//
// The two payload values are the only Slot-selectable policy fields (r6 section
// 13). Version numbering and the validity window are assigned by consensus.
message MsgUpdateSelectionPolicy {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1;
  uint64 slot_id = 2;
  uint64 selection_rate_bps = 3;
  uint64 max_selected_participants = 4;
}
message MsgUpdateSelectionPolicyResponse {
  uint64 policy_version = 1;
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2;
}
message MsgUpdateParamsResponse {}
