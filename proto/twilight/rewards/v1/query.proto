syntax = "proto3";
package twilight.rewards.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "google/api/annotations.proto";
import "twilight/rewards/v1/params.proto";
import "twilight/rewards/v1/rewards.proto";

option go_package = "github.com/twilight-project/twilight-core/x/rewards/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/params";
  }
  rpc EpochInfo(QueryEpochInfoRequest) returns (QueryEpochInfoResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/epoch-info";
  }
  rpc NextHalving(QueryNextHalvingRequest) returns (QueryNextHalvingResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/next-halving";
  }
  rpc EpochReward(QueryEpochRewardRequest) returns (QueryEpochRewardResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/epochs/{epoch_number}";
  }
  rpc SlotRewards(QuerySlotRewardsRequest) returns (QuerySlotRewardsResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/slots/{slot_id}/rewards";
  }
  rpc ClaimableRewards(QueryClaimableRewardsRequest) returns (QueryClaimableRewardsResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/slots/{slot_id}/claimable";
  }
  rpc CumulativeEmitted(QueryCumulativeEmittedRequest) returns (QueryCumulativeEmittedResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/cumulative-emitted";
  }
  rpc SupplySchedule(QuerySupplyScheduleRequest) returns (QuerySupplyScheduleResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/supply-schedule";
  }
  rpc CurrentEpochActiveBlocks(QueryCurrentEpochActiveBlocksRequest) returns (QueryCurrentEpochActiveBlocksResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/current-epoch/active-blocks";
  }
  rpc ModuleBalances(QueryModuleBalancesRequest) returns (QueryModuleBalancesResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/module-balances";
  }
  rpc EpochConfigVersions(QueryEpochConfigVersionsRequest) returns (QueryEpochConfigVersionsResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/epoch-config-versions";
  }
  rpc EpochBoundaries(QueryEpochBoundariesRequest) returns (QueryEpochBoundariesResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/epochs/{epoch_number}/boundaries";
  }
  rpc SlotEntitlement(QuerySlotEntitlementRequest) returns (QuerySlotEntitlementResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/slots/{slot_id}/entitlements/{epoch}";
  }
  rpc SlotEntitlementsByEpoch(QuerySlotEntitlementsByEpochRequest) returns (QuerySlotEntitlementsByEpochResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/epochs/{epoch}/entitlements";
  }
  rpc RewardConfigVersions(QueryRewardConfigVersionsRequest) returns (QueryRewardConfigVersionsResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/reward-config-versions";
  }
  rpc RewardsPauseState(QueryRewardsPauseStateRequest) returns (QueryRewardsPauseStateResponse) {
    option (google.api.http).get = "/twilight/rewards/v1/pause-state";
  }
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1; }

message QueryEpochInfoRequest {}
message QueryEpochInfoResponse {
  RewardsState state = 1;
  EpochConfigSnapshot current_epoch_config = 2;
  uint64 current_epoch_end_height = 3;
  bool has_pending_params = 4;
  Params pending_params = 5;
  // Canonical geometry for the open epoch, derived from EpochConfigVersion
  // history rather than from the deprecated snapshot mirror.
  uint64 current_epoch_start_height = 6;
  uint64 current_epoch_length_blocks = 7;
  // Reward-enabled blocks accrued so far in the open epoch.
  uint64 open_reward_enabled_blocks = 8;
}

message QueryNextHalvingRequest {}
message QueryNextHalvingResponse { NextHalvingInfo info = 1; }

message QueryEpochRewardRequest { uint64 epoch_number = 1; }
message QueryEpochRewardResponse { EpochReward epoch_reward = 1; }

message QuerySlotRewardsRequest {
  uint64 slot_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QuerySlotRewardsResponse {
  repeated EligibleSlotReward rewards = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryClaimableRewardsRequest {
  uint64 slot_id = 1;
  uint64 start_epoch = 2;
  uint64 end_epoch = 3;
}
message QueryClaimableRewardsResponse {
  repeated EligibleSlotReward rewards = 1;
  string total_amount = 2;
}

message QueryCumulativeEmittedRequest {}
message QueryCumulativeEmittedResponse {
  string cumulative_emitted = 1;
  string max_supply = 2;
}

message QuerySupplyScheduleRequest {}
message QuerySupplyScheduleResponse {
  Params params = 1;
  NextHalvingInfo next_halving = 2;
}

message QueryCurrentEpochActiveBlocksRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QueryCurrentEpochActiveBlocksResponse {
  uint64 epoch_number = 1;
  repeated SlotActiveBlocks active_blocks = 2;
  cosmos.base.query.v1beta1.PageResponse pagination = 3;
}

message QueryModuleBalancesRequest {}
message QueryModuleBalancesResponse {
  string denom = 1;
  string rewards_balance = 2;
  string fee_pool_balance = 3;
  // The two quantities the escrow balance must cover, so solvency is observable
  // without reading the database: rewards_balance == outstanding liability +
  // carry immediately after a finalization commits.
  string outstanding_entitlement_liability = 4;
  string carry_forward_remainder = 5;
}

message QuerySlotEntitlementRequest {
  uint64 slot_id = 1;
  uint64 epoch = 2;
}
message QuerySlotEntitlementResponse {
  SlotEntitlement entitlement = 1;
}

message QuerySlotEntitlementsByEpochRequest {
  uint64 epoch = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QuerySlotEntitlementsByEpochResponse {
  // Ascending by slot_id, which is a property of the canonical key rather than a
  // sort applied to the response.
  repeated SlotEntitlement entitlements = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryRewardConfigVersionsRequest {
  // Paginates the immutable history.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QueryRewardConfigVersionsResponse {
  repeated RewardConfigVersion versions = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
  // The single pending change, when one exists. At most one is valid, keyed
  // exactly at current_epoch + 1, so it is a field rather than a paginated list.
  ScheduledRewardConfig scheduled = 3;
}

message QueryEpochConfigVersionsRequest {
  // Paginates the immutable history.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  // Bounded window over the future schedule, which is a separate collection and
  // cannot share the history's page cursor. It is expressed as an explicit
  // epoch cursor rather than a second PageRequest because the schedule is keyed
  // by effective epoch and is walked in that order.
  //
  // Zero starts at the first scheduled epoch.
  uint64 scheduled_start_epoch = 2;
  // Maximum number of scheduled entries to return. Zero applies the server
  // default; values above the server maximum are reduced to it.
  uint32 scheduled_limit = 3;
}
message QueryEpochConfigVersionsResponse {
  repeated EpochConfigVersion versions = 1;
  repeated ScheduledEpochConfig scheduled = 2;
  cosmos.base.query.v1beta1.PageResponse pagination = 3;
  // Effective epoch of the first scheduled entry NOT included in `scheduled`,
  // to be passed back as scheduled_start_epoch. Zero when the window reached
  // the end of the schedule.
  uint64 scheduled_next_epoch = 4;
}

message QueryEpochBoundariesRequest { uint64 epoch_number = 1; }
message QueryEpochBoundariesResponse {
  uint64 epoch_number = 1;
  uint64 start_height = 2;
  uint64 end_height = 3;
  uint64 epoch_length_blocks = 4;
}

message QueryRewardsPauseStateRequest {}
message QueryRewardsPauseStateResponse {
  RewardsPauseState pause_state = 1;
  // Whether settlement/monetary release is permitted for the current block,
  // i.e. the already-effective state. A pending H+1 transition is not applied.
  bool release_enabled = 2;
}
