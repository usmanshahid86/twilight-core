syntax = "proto3";
package twilight.rewards.v1;

import "twilight/rewards/v1/params.proto";
import "twilight/rewards/v1/rewards.proto";

option go_package = "github.com/twilight-project/twilight-core/x/rewards/types";

message GenesisState {
  Params params = 1;
  RewardsState state = 2;
  repeated EpochReward finalized_epochs = 3;
  repeated EligibleSlotReward claim_records = 4;
  EpochConfigSnapshot current_epoch_config = 5;
  bool has_pending_params = 6;
  Params pending_params = 7;
  // Canonical epoch-configuration history. Fresh genesis carries exactly one
  // entry: version 1, effective at epoch 1, anchored to the chain's initial
  // height.
  repeated EpochConfigVersion epoch_config_versions = 8;
  // Future epoch-length schedule keyed by effective epoch. Fresh genesis
  // requires this to be empty; a non-empty schedule is continuation state.
  repeated ScheduledEpochConfig scheduled_epoch_configs = 9;
  // The single canonical rewards-pause state.
  RewardsPauseState pause_state = 10;
  // The open epoch's reward-enabled block count. Fresh genesis requires zero.
  uint64 open_reward_enabled_blocks = 11;
  // Canonical reward-configuration history. Fresh genesis carries exactly one
  // entry: version 1, effective at epoch 1.
  repeated RewardConfigVersion reward_config_versions = 12;
  // The single pending reward-configuration change, keyed by effective epoch.
  // Fresh genesis requires this to be empty; a populated entry is continuation
  // state and its key must be exactly current_epoch + 1.
  repeated ScheduledRewardConfig scheduled_reward_configs = 13;
  // Canonical finalized entitlements. Fresh genesis requires this to be empty:
  // a fresh chain has finalized no epoch and therefore owes nothing.
  repeated SlotEntitlement slot_entitlements = 14;
  // The O(1) outstanding entitlement liability, as a canonical base-10 amount.
  //
  // Written explicitly and required to be exactly "0" at fresh genesis. After
  // initialization an absent or unreadable value is corruption rather than zero:
  // defaulting it would silently forget what the module owes.
  string outstanding_entitlement_liability = 15;
}
