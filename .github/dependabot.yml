version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns:
          - "*"
    # Consensus-critical libraries are upgraded deliberately (changelog review,
    # code changes, localnet + multi-node app-hash validation), never via an
    # auto-PR. govulncheck (blocking in CI) is the backstop for reachable vulns.
    ignore:
      - dependency-name: "github.com/cosmos/cosmos-sdk"
      - dependency-name: "github.com/cometbft/cometbft"
      - dependency-name: "cosmossdk.io/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  # Docusaurus docs site dependencies (isolated under website/).
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Take security patches/minors automatically; major bumps (e.g. React 19,
    # TypeScript 6) are deliberate and tied to a Docusaurus upgrade.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @mermaid-js/layout-elk is an optional peer of @docusaurus/theme-mermaid
      # (pinned to ^0.1.9). 0.2.x breaks that peer (npm ci ERESOLVE) until a
      # Docusaurus bump raises it, so keep it on 0.1.x patches only. A 0.x minor
      # (0.1 -> 0.2) is a breaking change, hence ignoring minor here too.
      - dependency-name: "@mermaid-js/layout-elk"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
