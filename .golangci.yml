# golangci-lint configuration for twilight-core (v2 format).
# Moderate, non-noisy baseline; tighten over time (e.g. add gosec, revive).
# Migrated from v1 for golangci-lint v2.x / Go 1.25; default linters
# (errcheck, govet, ineffassign, staticcheck, unused) are enabled implicitly.
version: "2"
run:
  go: "1.25"
linters:
  enable:
    - misspell
    - unconvert
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - .*\.pb\.go$
      - .*\.pb\.gw\.go$
      - .*\.pulsar\.go$
      - website
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/twilight-project/twilight-core
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - .*\.pb\.gw\.go$
      - .*\.pulsar\.go$
      - website
      - third_party$
      - builtin$
      - examples$
