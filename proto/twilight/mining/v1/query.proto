syntax = "proto3";
package twilight.mining.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "google/api/annotations.proto";
import "twilight/mining/v1/mining.proto";

option go_package = "github.com/twilight-project/twilight-core/x/mining/types";

// The observability surface a settlement worker recovers from.
//
// The governing requirement is that events are never required for correctness. A
// worker may lose its transaction response, its event stream, its process and its
// local database, and must still be able to determine from committed chain state
// alone exactly what operation comes next. Everything below exists to make that
// possible.
//
// Responses separate three kinds of value and never blur them:
//
//   canonical    stored x/mining state, returned exactly as stored
//   correlated   authoritative x/rewards state, read at query time, never stored here
//   derived      computed at query time from the two above, never stored anywhere
//
// No derived value has a stored counterpart. A settlement records no released
// amount, no remaining amount, no ceiling, no created height, no created clock and
// no deadline, because a stored copy of any of them would be a second authority
// able to disagree with the one the release boundary actually enforces.
service Query {
  // Settlement returns one settlement with everything needed to decide the next
  // operation against it.
  rpc Settlement(QuerySettlementRequest) returns (QuerySettlementResponse) {
    option (google.api.http).get = "/twilight/mining/v1/settlements/{slot_id}/{epoch}";
  }

  // OpenSettlements lists a Slot's outstanding settlements from canonical rows,
  // bounded per request. The derived open-settlement index is deliberately NOT the
  // completeness authority here: a missing index entry is indistinguishable from a
  // lost one, so traversing it could hide an obligation the chain still owes.
  rpc OpenSettlements(QueryOpenSettlementsRequest) returns (QueryOpenSettlementsResponse) {
    option (google.api.http).get = "/twilight/mining/v1/slots/{slot_id}/open-settlements";
  }

  // SettlementClock returns the canonical settlement clock. It is NOT a block
  // height: it advances only on blocks whose beginning-of-block pause state
  // permitted settlement release.
  rpc SettlementClock(QuerySettlementClockRequest) returns (QuerySettlementClockResponse) {
    option (google.api.http).get = "/twilight/mining/v1/settlement-clock";
  }

  // DistributionModeVersion returns one distribution-mode record by its exact
  // version number.
  rpc DistributionModeVersion(QueryDistributionModeVersionRequest) returns (QueryDistributionModeVersionResponse) {
    option (google.api.http).get = "/twilight/mining/v1/distribution-mode-versions/{version}";
  }
  rpc DistributionModeVersions(QueryDistributionModeVersionsRequest) returns (QueryDistributionModeVersionsResponse) {
    option (google.api.http).get = "/twilight/mining/v1/distribution-mode-versions";
  }

  // SelectionParamsVersion returns one Selection-parameter record by exact version.
  rpc SelectionParamsVersion(QuerySelectionParamsVersionRequest) returns (QuerySelectionParamsVersionResponse) {
    option (google.api.http).get = "/twilight/mining/v1/selection-params-versions/{version}";
  }
  rpc SelectionParamsVersions(QuerySelectionParamsVersionsRequest) returns (QuerySelectionParamsVersionsResponse) {
    option (google.api.http).get = "/twilight/mining/v1/selection-params-versions";
  }

  // SettlementParamsVersion returns one settlement-parameter record by exact
  // version.
  rpc SettlementParamsVersion(QuerySettlementParamsVersionRequest) returns (QuerySettlementParamsVersionResponse) {
    option (google.api.http).get = "/twilight/mining/v1/settlement-params-versions/{version}";
  }
  rpc SettlementParamsVersions(QuerySettlementParamsVersionsRequest) returns (QuerySettlementParamsVersionsResponse) {
    option (google.api.http).get = "/twilight/mining/v1/settlement-params-versions";
  }

  // TargetEpochInterpretation returns the chain's own reading of a target epoch:
  // which boundary binds it, which distribution-mode row governs that boundary, and
  // whether the target is canonically a Selection target.
  //
  // It exists so a consumer reads an interpretation instead of deriving one. The N-2
  // rule and the bootstrap exception are consensus rules; a second copy of them
  // outside the chain can drift from the arm settlement actually takes without
  // anything failing loudly.
  rpc TargetEpochInterpretation(QueryTargetEpochInterpretationRequest) returns (QueryTargetEpochInterpretationResponse) {
    option (google.api.http).get = "/twilight/mining/v1/target-epochs/{target_epoch}";
  }

  // ValidateEconomicAddress reports whether an address may receive protocol value,
  // under the same canonical rule settlement execution enforces.
  //
  // The address is a QUERY PARAMETER, not a path segment. A gateway path segment must
  // be non-empty to match its pattern, so a path form could not express the empty
  // address — which is a successful domain rejection here, not a malformed request.
  // Every enumerated case has to be reachable on every surface or the surfaces
  // disagree.
  rpc ValidateEconomicAddress(QueryValidateEconomicAddressRequest) returns (QueryValidateEconomicAddressResponse) {
    option (google.api.http).get = "/twilight/mining/v1/economic-address";
  }
}

message QuerySettlementRequest {
  uint64 slot_id = 1;
  uint64 epoch = 2;
}

// QuerySettlementResponse is everything a worker needs to resume against one
// settlement, with the authority of each value made explicit by its grouping.
message QuerySettlementResponse {
  // --- canonical: stored x/mining state, exactly as stored ---
  Settlement settlement = 1;

  // --- correlated: authoritative x/rewards state, never stored by x/mining ---
  string entitlement_amount = 2;
  string released_amount = 3;
  // The immutable destination the operator remainder is paid to. No caller can
  // name it and no transaction carries it.
  string payout_address = 4;

  // --- derived: computed here, stored nowhere ---
  string remaining_amount = 5;
  // How much of the entitlement participant chunks may still release in total.
  // Zero for an operator-only settlement, whose whole entitlement belongs to the
  // operator.
  string participant_distribution_ceiling = 6;
  // The settlement clock recorded by this epoch's anchor. Correlated canonical
  // anchor state, not a settlement field.
  uint64 created_settlement_clock = 7;
  // For a participant-capable settlement, the clock at which its participant
  // window closes. For an operator-only settlement this equals the anchor clock
  // and is NOT an authorization boundary — such a settlement is finalizable
  // immediately and never becomes deadline-gated.
  uint64 deadline_clock = 8;
  // Whether finalization is available to any valid account right now. False for a
  // finalized settlement, because no finalization remains available at all — never
  // read it as an invitation to retry a terminal transition.
  bool permissionless_finalization_now = 9;
  // The canonical clock at the height this query was served, so a caller can
  // compare it against deadline_clock without a second round trip.
  uint64 current_settlement_clock = 10;
}

message QueryOpenSettlementsRequest {
  uint64 slot_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryOpenSettlementsResponse returns canonical settlement rows.
//
// The per-request bound is on canonical rows INSPECTED, not on results returned, so
// a page may contain fewer results than the limit — or none — while more open
// settlements exist further on. Follow next_key until it comes back empty; an empty
// page is not proof that a Slot has no outstanding work.
message QueryOpenSettlementsResponse {
  repeated Settlement settlements = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QuerySettlementClockRequest {}
message QuerySettlementClockResponse {
  uint64 settlement_clock = 1;
}

message QueryDistributionModeVersionRequest { uint64 version = 1; }
message QueryDistributionModeVersionResponse { MiningDistributionModeVersion version = 1; }

message QueryDistributionModeVersionsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QueryDistributionModeVersionsResponse {
  repeated MiningDistributionModeVersion versions = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QuerySelectionParamsVersionRequest { uint64 version = 1; }
message QuerySelectionParamsVersionResponse { SelectionParamsVersion version = 1; }

message QuerySelectionParamsVersionsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QuerySelectionParamsVersionsResponse {
  repeated SelectionParamsVersion versions = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QuerySettlementParamsVersionRequest { uint64 version = 1; }
message QuerySettlementParamsVersionResponse { SettlementParamsVersion version = 1; }

message QuerySettlementParamsVersionsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QuerySettlementParamsVersionsResponse {
  repeated SettlementParamsVersion versions = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// The chain's canonical reading of one target epoch.
//
// binding_epoch is DIAGNOSTIC. It reports which boundary the answer came from so an
// operator can audit the interpretation; it is not a second authority, and a consumer
// that recomputes anything from it has reintroduced the copy this query removes.
message QueryTargetEpochInterpretationRequest {
  uint64 target_epoch = 1;
}
message QueryTargetEpochInterpretationResponse {
  uint64 target_epoch = 1;
  // 0 for bootstrap targets, target_epoch - 2 otherwise.
  uint64 binding_epoch = 2;
  // The full governing record, so a consumer maps mode and version into its own
  // snapshot rather than reading fields this response chose to duplicate.
  MiningDistributionModeVersion distribution_mode_version = 3;
  // Whether the target is canonically bound to the PROTOCOL_SELECTION arm with a
  // complete N-2 binding.
  //
  // This is a statement about binding, NOT about runtime readiness: it does not assert
  // that a Selection producer is enabled in the current deployment or profile.
  bool selection_applicable = 4;
  // True for targets 1 and 2, which have no N-2 boundary inside chain history and
  // resolve from the genesis anchor.
  bool bootstrap_mode_without_full_n_minus_2_binding = 5;
}

// Why an address may not receive protocol value.
//
// Declared here rather than in mining.proto because it is query-only and must never
// become stored state. Keeping it out of the stored-state file makes that structural
// instead of a convention someone has to remember.
//
// The economic-address validator's sentinels are the sole authority for these values.
// A handler may only map those sentinels onto this enum; it may not infer a cause of
// its own, and an unrecognised failure is an RPC error rather than a guessed value.
enum EconomicAddressRejectionReason {
  ECONOMIC_ADDRESS_REJECTION_REASON_UNSPECIFIED = 0;
  // Admissible: no rejection.
  ECONOMIC_ADDRESS_REJECTION_REASON_NONE = 1;
  ECONOMIC_ADDRESS_REJECTION_REASON_EMPTY = 2;
  // Not an account address for this chain: malformed, foreign prefix, or all-zero.
  ECONOMIC_ADDRESS_REJECTION_REASON_INVALID = 3;
  ECONOMIC_ADDRESS_REJECTION_REASON_MODULE_ACCOUNT = 4;
  ECONOMIC_ADDRESS_REJECTION_REASON_BANK_BLOCKED = 5;
}

message QueryValidateEconomicAddressRequest {
  string address = 1;
}
message QueryValidateEconomicAddressResponse {
  bool admissible = 1;
  EconomicAddressRejectionReason rejection_reason = 2;
  // The parsed address, populated ONLY when admissible.
  //
  // It stays empty on every rejection, including the ones that parse perfectly well —
  // a module account or a bank-blocked address is syntactically fine and still
  // inadmissible. Emitting a canonical-looking value there would give downstream code
  // something it could mistake for acceptance.
  string canonical_address = 3;
}
