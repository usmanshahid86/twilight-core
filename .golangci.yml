# golangci-lint configuration for twilight-core.
# Moderate, non-noisy baseline; tighten over time (e.g. add gosec, revive).
run:
  timeout: 5m
  go: "1.23"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
    - misspell
    - unconvert

linters-settings:
  goimports:
    local-prefixes: github.com/twilight-project/twilight-core
  misspell:
    locale: US

issues:
  # Generated code is not linted.
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*\\.pb\\.gw\\.go$"
    - ".*\\.pulsar\\.go$"
  exclude-dirs:
    - website
  exclude-rules:
    # Tests routinely ignore errors on cleanup paths.
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
