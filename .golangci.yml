# golangci-lint configuration for twilight-core (v2 format).
# Moderate, non-noisy baseline; tighten over time (e.g. add gosec, revive).
# Migrated from v1 for golangci-lint v2.x / Go 1.25; default linters
# (errcheck, govet, ineffassign, staticcheck, unused) are enabled implicitly.
version: "2"
run:
  go: "1.25"
linters:
  enable:
    - misspell
    - unconvert
  settings:
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        # QF1008 asks for embedded fields to be dropped from selectors, turning
        # blk.Block.Header.AppHash into blk.Block.AppHash. That reads as though
        # Block carries the field directly, which is exactly what the explicit
        # path is there to deny. A style preference, and this codebase's
        # preference is the explicit one.
        - -QF1008
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      # Cosmos SDK deprecations that are answered by an SDK upgrade, not by a
      # local edit.
      #
      # The invariant types are deprecated pending the removal of x/crisis, which
      # this chain does not run — the invariants here are callable backstops, and
      # there is no non-deprecated SDK type for them until that removal lands.
      # module.AppModule / module.HasInvariants belong to the same migration.
      #
      # Excluded rather than worked around so the code keeps saying what it means.
      # Revisit as part of the cosmos-sdk / cometbft upgrade, where the
      # replacements arrive together; do NOT widen this to all of SA1019, which
      # would hide deprecations that a local edit could fix.
      - linters:
          - staticcheck
        text: "SA1019: (sdk\\.(Invariant|FormatInvariant|InvariantRegistry)|module\\.(AppModule|HasInvariants)) is deprecated"
    paths:
      - .*\.pb\.go$
      - .*\.pb\.gw\.go$
      - .*\.pulsar\.go$
      - website
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/twilight-project/twilight-core
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - .*\.pb\.gw\.go$
      - .*\.pulsar\.go$
      - website
      - third_party$
      - builtin$
      - examples$
