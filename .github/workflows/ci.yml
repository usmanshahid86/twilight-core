name: CI

on:
  push:
    branches: [main, develop]
  # Deliberately unfiltered by base branch. A base filter of [main, develop] gates
  # only the bottom PR of a stack: every PR that targets another feature branch —
  # which is how a large change is split into reviewable gates — would get no CI at
  # all, and would get it silently. Running on every pull request costs extra runs
  # and closes that gap. docs.yml already triggers this way.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Vulncheck toolchain pin
        # Same script as `make check-vulncheck-pin`. The vulnerability gate pins
        # the Go toolchain to the version go.mod declares, and THIS job cannot
        # detect the loss of that pin on its own: setup-go has already selected
        # the same toolchain, so removing the pin leaves every job green while a
        # developer machine silently scans under a different compiler. The check
        # runs the real script against a fake `go` and inspects what it passes.
        run: ./scripts/check-vulncheck-pin.sh
      - name: Release-upgrade rehearsal faults
        # Same script as `make release-upgrade-faults`. The rehearsal itself
        # downloads a published artifact and runs four validators through a real
        # upgrade boundary, which is too slow and too network-dependent for every
        # push — but its proof primitives are exactly the things whose silent
        # failure turns a broken run green, so they are covered here against stubs.
        run: ./scripts/localnet/release-upgrade-rehearsal-faults.sh
      - name: Block-gas drill faults
        # Same script as `make block-gas-faults`. The drill itself launches four
        # validators, funds sixty accounts and floods them, which is far too slow
        # for every push — but its primitives all have a failure mode that presents
        # as success: a window of unreadable blocks contains no block over the
        # ceiling, an empty block and an unreadable one both have no failing
        # transactions, and `max_gas` of 0 is not -1 and is also not a ceiling.
        # Those run here, against stubs, with no chain.
        run: ./scripts/localnet/block-gas-drill-faults.sh
      - name: Genesis verifier faults
        # Same script as `make check-genesis-faults`. Cutting genesis is largely a
        # hand edit of JSON — every rewards, mining and coreslot parameter, and
        # block.max_gas — and the chain's own `twilightd validate` PASSES a genesis
        # whose max_gas is still -1. check-genesis.sh is what stands in that gap,
        # so its own checks need covering: a verifier that stops verifying does not
        # go quiet, it goes green. Three bugs in its first draft each killed a real
        # check while it still reported success. Builds a baseline genesis with the
        # real binary rather than a fixture that could drift, and starts no chain.
        run: ./scripts/check-genesis-faults.sh
      - name: CLI surface
        # Same script as `make check-cli-surface`. The Go test asserts the
        # assembled cobra tree, which proves a command exists, not that it runs:
        # the defect this guards lived entirely in flag parsing, on a command the
        # tree said was present. So this builds the binary and drives the real
        # `--generate-only` path an operator drives.
        run: ./scripts/check-cli-surface.sh

  consensus-vectors:
    name: consensus vectors
    runs-on: ubuntu-latest
    # Blocking, and deliberately a separate job from build & test. The normative
    # vector packs are the executable form of frozen protocol behaviour, so a
    # conformance failure must be visible as its own red check rather than as one
    # line inside a general test run.
    #
    # The packs are tracked bytes under internal/consensusvectors/testdata and are
    # never fetched at run time: a gate that downloads its own fixtures certifies
    # whatever it was served, not what the repository contains.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run protocol-vector conformance
        # Same script as `make consensus-vectors`, so local and CI results cannot
        # diverge. The script confirms every required conformance test exists
        # before running it, because `go test -run` exits 0 on a regex that
        # matches nothing.
        run: ./scripts/consensus-vectors.sh

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2.x is required for Go 1.25 (the v1 line stops at Go 1.24).
          # .golangci.yml is in v2 config format. Bump this pin intentionally.
          version: v2.12.2
          # Only flag issues introduced by the PR — keeps the large existing
          # codebase from blocking CI while enforcing quality on new code.
          only-new-issues: true

  formatting:
    name: gofmt & tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './website/*'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  proto-descriptor:
    name: proto descriptor up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protoc (pinned)
        # Must match EXPECTED_PROTOC_VERSION in scripts/export-proto-descriptor.sh —
        # the descriptor set is byte-reproducible only for a fixed protoc version.
        run: |
          PROTOC_VERSION=27.0
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
      - name: Populate module cache (proto include paths)
        # Explicitly fetch the modules whose proto/ trees the export script includes.
        # Some are indirect / proto-only deps (e.g. gogo/googleapis) that a bare
        # `go mod download` can prune, leaving the script's include paths missing.
        run: |
          go mod download
          go mod download \
            github.com/cosmos/cosmos-sdk \
            github.com/cosmos/gogoproto \
            cosmossdk.io/api \
            github.com/cosmos/cosmos-proto \
            github.com/gogo/googleapis
      - name: Regenerate descriptor
        run: make proto-descriptor
      - name: Verify committed descriptor is up to date
        run: |
          changed=$(git status --porcelain -- docs/proto/)
          if [ -n "$changed" ]; then
            echo "::error::docs/proto/ is stale. Run 'make proto-descriptor' (protoc 27.0) and commit the result."
            echo "$changed"
            git diff -- docs/proto/ || true
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Blocking. A reachable advisory fails CI and is triaged rather than silently
    # accumulating; advisories in required modules the code does not call do not fail it.
    #
    # Advisories that are reachable but have no available fix are accepted explicitly in
    # .govulncheck-allow.json, with a reason and a review_by date. Anything reachable and
    # not listed there still fails, and an expired acceptance also fails, so an exception
    # cannot outlive its review date. See REVIEW.md.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        # Same script as `make vuln`, so local and CI results cannot diverge. The
        # govulncheck version is pinned inside it (bump intentionally, like
        # protoc/golangci-lint) so a new release cannot change gating behavior
        # without a code change.
        run: ./scripts/vulncheck.sh ./...
